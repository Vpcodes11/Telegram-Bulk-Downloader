<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Media Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </div>
            <h1>Telegram Pro</h1>
            <p>Advanced Media Extraction Suite</p>
        </header>

        <main>
            <!-- Step 1: Configuration -->
            <section id="step-config" class="card active">
                <h2>Configuration</h2>
                <form id="config-form">
                    <div class="input-group">
                        <label>API ID</label>
                        <input type="number" id="api-id" required placeholder="12345678">
                    </div>
                    <div class="input-group">
                        <label>API Hash</label>
                        <input type="text" id="api-hash" required placeholder="3e50e577960343532691...">
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" required placeholder="+1234567890">
                    </div>
                    <button type="submit" class="btn primary" id="btn-login">
                        <span>Initialize Session</span>
                        <div class="loader hidden" id="login-loader"></div>
                    </button>
                    <div class="error-msg" id="login-error"></div>
                </form>
            </section>

            <!-- Step 2: Verification Code -->
            <section id="step-code" class="card">
                <h2>Identity Verification</h2>
                <p class="subtitle">Enter the 5-digit code sent to your device.</p>
                <form id="code-form">
                    <div class="input-group">
                        <label>Login Code</label>
                        <input type="text" id="verification-code" required placeholder="00000">
                    </div>
                    <div class="input-group hidden" id="password-group">
                        <label>2FA Password</label>
                        <input type="password" id="2fa-password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn primary" id="btn-verify">
                        <span>Verify Identity</span>
                        <div class="loader hidden" id="verify-loader"></div>
                    </button>
                    <div class="error-msg" id="verify-error"></div>
                </form>
            </section>

            <!-- Step 3: Download Control -->
            <section id="step-download" class="card">
                <div class="status-badge">Authenticated Session</div>
                <h2>Media Extraction</h2>
                <form id="download-form">
                    <div class="input-group">
                        <label>Target Channel or Chat</label>
                        <input type="text" id="chat-name" required placeholder="@channelname or link">
                    </div>
                    <div class="input-group">
                        <label>Download Threads <span class="range-val" id="thread-count">5</span></label>
                        <input type="range" id="concurrent" min="1" max="15" value="5" oninput="document.getElementById('thread-count').innerText = this.value">
                    </div>
                    <button type="submit" class="btn primary" id="btn-start">
                        <span>Start Extraction</span>
                    </button>
                    <div class="error-msg" id="download-error"></div>
                </form>

                <div id="progress-container" class="hidden">
                    <div class="progress-info">
                        <span id="status-text">Processing...</span>
                        <span id="status-count">0 / 0</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
